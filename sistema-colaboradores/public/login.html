<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login · Sistema de Colaboradores QLP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Sora', sans-serif;
    min-height: 100vh;
    display: flex;
    background: #0A2E5C;
    position: relative;
    overflow: hidden;
  }

  /* Fundo animado */
  .bg-grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
    background-size: 60px 60px;
  }
  .bg-blob {
    position: absolute; border-radius: 50%; filter: blur(80px);
    animation: float 8s ease-in-out infinite;
  }
  .bg-blob-1 { width: 500px; height: 500px; background: rgba(37,99,235,0.25); top: -200px; right: -100px; }
  .bg-blob-2 { width: 400px; height: 400px; background: rgba(5,150,105,0.15); bottom: -100px; left: -100px; animation-delay: -4s; }
  @keyframes float { 0%,100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-30px) scale(1.05); } }

  /* Layout */
  .login-wrapper {
    position: relative; z-index: 10;
    display: flex; align-items: center; justify-content: center;
    width: 100%; padding: 20px;
  }

  .login-box {
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 24px;
    width: 100%; max-width: 420px;
    padding: 44px 40px;
    box-shadow: 0 25px 50px rgba(0,0,0,0.4);
    animation: slideUp 0.5s ease;
  }
  @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: none; } }

  .brand {
    text-align: center; margin-bottom: 36px;
  }
  .brand-logo {
    display: inline-flex; align-items: center; justify-content: center;
    width: 64px; height: 64px;
    background: #2563EB; border-radius: 16px;
    font-size: 22px; font-weight: 800; color: #fff;
    margin-bottom: 16px;
    box-shadow: 0 8px 20px rgba(37,99,235,0.4);
  }
  .brand h1 { font-size: 22px; font-weight: 800; color: #fff; margin-bottom: 4px; }
  .brand p { font-size: 13px; color: rgba(255,255,255,0.5); }

  .form-group { margin-bottom: 18px; }
  .form-label { display: block; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: rgba(255,255,255,0.6); margin-bottom: 8px; }
  .input-wrapper { position: relative; }
  .input-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: rgba(255,255,255,0.35); width: 18px; height: 18px; }
  input {
    width: 100%; padding: 13px 16px 13px 44px;
    background: rgba(255,255,255,0.07);
    border: 1.5px solid rgba(255,255,255,0.12);
    border-radius: 10px;
    color: #fff; font-family: 'Sora', sans-serif; font-size: 14px;
    outline: none; transition: all 0.2s;
  }
  input::placeholder { color: rgba(255,255,255,0.25); }
  input:focus { border-color: #2563EB; background: rgba(255,255,255,0.1); box-shadow: 0 0 0 3px rgba(37,99,235,0.25); }

  .btn-login {
    width: 100%; padding: 14px;
    background: #2563EB; color: #fff;
    border: none; border-radius: 10px;
    font-family: 'Sora', sans-serif; font-size: 15px; font-weight: 700;
    cursor: pointer; transition: all 0.2s;
    margin-top: 8px;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .btn-login:hover:not(:disabled) { background: #1D4ED8; transform: translateY(-1px); box-shadow: 0 8px 20px rgba(37,99,235,0.4); }
  .btn-login:disabled { opacity: 0.6; cursor: not-allowed; }

  .error-msg {
    background: rgba(220,38,38,0.15); border: 1px solid rgba(220,38,38,0.35);
    border-radius: 8px; padding: 10px 14px;
    color: #FCA5A5; font-size: 13px; margin-top: 14px;
    display: none; align-items: center; gap: 8px;
  }
  .error-msg.show { display: flex; }

  .hint {
    text-align: center; margin-top: 28px;
    font-size: 12px; color: rgba(255,255,255,0.3);
    border-top: 1px solid rgba(255,255,255,0.08);
    padding-top: 20px;
  }
  .hint strong { color: rgba(255,255,255,0.55); }
</style>
</head>
<body>
<div class="bg-grid"></div>
<div class="bg-blob bg-blob-1"></div>
<div class="bg-blob bg-blob-2"></div>

<div class="login-wrapper">
  <div class="login-box">
    <div class="brand">
      <div class="brand-logo">QLP</div>
      <h1>Sistema de Colaboradores</h1>
      <p>IPAUSSU · 2026 — Acesso Restrito</p>
    </div>

    <div class="form-group">
      <label class="form-label">Usuário</label>
      <div class="input-wrapper">
        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <input type="text" id="username" placeholder="Digite seu usuário" autocomplete="username">
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">Senha</label>
      <div class="input-wrapper">
        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        <input type="password" id="password" placeholder="Digite sua senha" autocomplete="current-password">
      </div>
    </div>

    <button class="btn-login" id="btn-login">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
      Entrar
    </button>

    <div class="error-msg" id="error-msg">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v4m0 4h.01"/></svg>
      <span id="error-text">Usuário ou senha inválidos.</span>
    </div>

    <div class="hint">
      Acesso somente para usuários autorizados.<br>
      Em caso de problemas, contate o <strong>Administrador do Sistema</strong>.
    </div>
  </div>
</div>

<script>
  async function doLogin() {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    const btn = document.getElementById('btn-login');
    const errEl = document.getElementById('error-msg');
    const errText = document.getElementById('error-text');

    errEl.classList.remove('show');
    if (!username || !password) {
      errText.textContent = 'Preencha usuário e senha.';
      errEl.classList.add('show'); return;
    }

    btn.disabled = true;
    btn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="animation:spin .7s linear infinite"><path d="M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0"/></svg> Entrando…`;

    try {
      const r = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      const data = await r.json();
      if (r.ok) {
        window.location.href = '/dashboard.html';
      } else {
        errText.textContent = data.error || 'Erro ao fazer login.';
        errEl.classList.add('show');
        btn.disabled = false;
        btn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg> Entrar`;
      }
    } catch {
      errText.textContent = 'Erro de conexão. Tente novamente.';
      errEl.classList.add('show');
      btn.disabled = false;
    }
  }

  document.getElementById('btn-login').addEventListener('click', doLogin);
  document.getElementById('password').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
  document.getElementById('username').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('password').focus(); });

  // Verifica se já está logado
  fetch('/api/auth/me').then(r => { if (r.ok) window.location.href = '/dashboard.html'; }).catch(() => {});

  const style = document.createElement('style');
  style.textContent = '@keyframes spin { to { transform: rotate(360deg); } }';
  document.head.appendChild(style);
</script>
</body>
</html>
