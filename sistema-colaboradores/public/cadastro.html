<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Novo Colaborador · Sistema QLP</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="toast-container"></div>
<div class="app-container">
  <div id="sidebar-placeholder"></div>

  <main class="main-content">
    <div class="topbar">
      <div class="topbar-title">Novo Colaborador</div>
      <div class="topbar-actions">
        <a href="/colaboradores.html" class="btn btn-secondary">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
          Voltar
        </a>
        <button class="btn btn-primary" id="btn-salvar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
          Salvar Colaborador
        </button>
      </div>
    </div>

    <div class="page-content">
      <div class="card">
        <div class="card-body">

          <!-- Dados Pessoais -->
          <div class="form-section">
            <div class="form-section-title">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
              Dados Pessoais
            </div>
            <div class="form-grid">
              <div class="form-group full">
                <label class="form-label required">Nome Completo</label>
                <input type="text" class="form-control" name="nome" placeholder="Nome completo do colaborador">
              </div>
              <div class="form-group">
                <label class="form-label required">CPF</label>
                <input type="text" class="form-control" name="cpf" placeholder="000.000.000-00">
              </div>
              <div class="form-group">
                <label class="form-label">RG</label>
                <input type="text" class="form-control" name="rg" placeholder="00.000.000-0">
              </div>
              <div class="form-group">
                <label class="form-label">Data Exp. RG</label>
                <input type="date" class="form-control" name="expRg">
              </div>
              <div class="form-group">
                <label class="form-label">PIS</label>
                <input type="text" class="form-control" name="pis" placeholder="000.00000.00-0">
              </div>
              <div class="form-group">
                <label class="form-label">Data de Nascimento</label>
                <input type="date" class="form-control" name="nascimento">
              </div>
              <div class="form-group">
                <label class="form-label">Naturalidade</label>
                <input type="text" class="form-control" name="naturalidade" placeholder="Cidade-UF">
              </div>
              <div class="form-group">
                <label class="form-label">Gênero</label>
                <select class="form-control" name="genero">
                  <option value="">Selecione…</option>
                  <option value="MASCULINO">Masculino</option>
                  <option value="FEMININO">Feminino</option>
                </select>
              </div>
              <div class="form-group">
                <label class="form-label">Estado Civil</label>
                <select class="form-control" name="estadoCivil">
                  <option value="">Selecione…</option>
                  <option>CASADO</option><option>SOLTEIRO</option>
                  <option>DIVORCIADO</option><option>VIÚVO</option>
                  <option>UNIÃO ESTÁVEL</option>
                </select>
              </div>
              <div class="form-group">
                <label class="form-label">Nome do Pai</label>
                <input type="text" class="form-control" name="nomePai">
              </div>
              <div class="form-group">
                <label class="form-label">Nome da Mãe</label>
                <input type="text" class="form-control" name="nomeMae">
              </div>
            </div>
          </div>

          <!-- Dados Profissionais -->
          <div class="form-section">
            <div class="form-section-title">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-4 0v2M8 7V5a2 2 0 0 0-4 0v2"/></svg>
              Dados Profissionais
            </div>
            <div class="form-grid">
              <div class="form-group">
                <label class="form-label">Matrícula</label>
                <input type="text" class="form-control" name="matricula" placeholder="970000000">
              </div>
              <div class="form-group required">
                <label class="form-label required">Função</label>
                <input type="text" class="form-control" name="funcao" placeholder="Ex: Motorista Carreteiro">
              </div>
              <div class="form-group">
                <label class="form-label required">Data de Admissão</label>
                <input type="date" class="form-control" name="admissao">
              </div>
              <div class="form-group">
                <label class="form-label">Data do ASO</label>
                <input type="date" class="form-control" name="aso">
              </div>
              <div class="form-group">
                <label class="form-label">Status</label>
                <select class="form-control" name="status">
                  <option value="CONTRATADO">Contratado</option>
                  <option value="DEMITIDO">Demitido</option>
                </select>
              </div>
              <div class="form-group">
                <label class="form-label">Safra / Novo</label>
                <select class="form-control" name="safraNovo">
                  <option value="">Selecione…</option>
                  <option>NOVO</option><option>SAFRA</option>
                </select>
              </div>
              <div class="form-group">
                <label class="form-label">Operação</label>
                <input type="text" class="form-control" name="operacao" placeholder="Ex: OPERAÇÃO">
              </div>
              <div class="form-group">
                <label class="form-label">Horário</label>
                <input type="text" class="form-control" name="horario" placeholder="Ex: 06:00-18:00">
              </div>
              <div class="form-group">
                <label class="form-label">Fixo / Folguista</label>
                <input type="text" class="form-control" name="fixoFolg">
              </div>
              <div class="form-group">
                <label class="form-label">Link da Pasta</label>
                <input type="url" class="form-control" name="linkPasta" placeholder="https://drive.google.com/…">
              </div>
            </div>
          </div>

          <!-- CNH -->
          <div class="form-section">
            <div class="form-section-title">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="4" width="22" height="16" rx="2"/><path d="M1 10h22"/></svg>
              Habilitação (CNH)
            </div>
            <div class="form-grid">
              <div class="form-group">
                <label class="form-label">Nº Registro</label>
                <input type="text" class="form-control" name="nrRegistro">
              </div>
              <div class="form-group">
                <label class="form-label">Categoria</label>
                <input type="text" class="form-control" name="categoria" placeholder="AE, E, B…">
              </div>
              <div class="form-group">
                <label class="form-label">Nº Documento</label>
                <input type="text" class="form-control" name="nrDocumento">
              </div>
              <div class="form-group">
                <label class="form-label">1ª Habilitação</label>
                <input type="date" class="form-control" name="primeiraHab">
              </div>
              <div class="form-group">
                <label class="form-label">Nº de Segurança</label>
                <input type="text" class="form-control" name="nrSeguranca">
              </div>
              <div class="form-group">
                <label class="form-label">RENACH</label>
                <input type="text" class="form-control" name="renach">
              </div>
              <div class="form-group">
                <label class="form-label">Estado da CNH</label>
                <input type="text" class="form-control" name="estadoCnh" placeholder="SÃO PAULO">
              </div>
              <div class="form-group">
                <label class="form-label">Vencimento CNH</label>
                <input type="date" class="form-control" name="vencimentoCnh">
              </div>
            </div>
          </div>

          <!-- Contato -->
          <div class="form-section">
            <div class="form-section-title">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 10a19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 3.6 1h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 8.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
              Contato e Endereço
            </div>
            <div class="form-grid">
              <div class="form-group">
                <label class="form-label">Telefone</label>
                <input type="text" class="form-control" name="telefone" placeholder="(00) 00000-0000">
              </div>
              <div class="form-group">
                <label class="form-label">E-mail</label>
                <input type="email" class="form-control" name="email" placeholder="email@exemplo.com">
              </div>
              <div class="form-group full">
                <label class="form-label">Endereço</label>
                <input type="text" class="form-control" name="endereco" placeholder="Rua, Avenida…">
              </div>
              <div class="form-group">
                <label class="form-label">Número</label>
                <input type="text" class="form-control" name="numero">
              </div>
              <div class="form-group">
                <label class="form-label">Bairro</label>
                <input type="text" class="form-control" name="bairro">
              </div>
              <div class="form-group">
                <label class="form-label">Cidade</label>
                <input type="text" class="form-control" name="cidade">
              </div>
              <div class="form-group">
                <label class="form-label">UF</label>
                <select class="form-control" name="uf">
                  <option value="">UF</option>
                  <option>AC</option><option>AL</option><option>AM</option><option>AP</option>
                  <option>BA</option><option>CE</option><option>DF</option><option>ES</option>
                  <option>GO</option><option>MA</option><option>MG</option><option>MS</option>
                  <option>MT</option><option>PA</option><option>PB</option><option>PE</option>
                  <option>PI</option><option>PR</option><option>RJ</option><option>RN</option>
                  <option>RO</option><option>RR</option><option>RS</option><option selected>SP</option>
                  <option>SC</option><option>SE</option><option>TO</option>
                </select>
              </div>
              <div class="form-group">
                <label class="form-label">CEP</label>
                <input type="text" class="form-control" name="cep" placeholder="00000-000">
              </div>
            </div>
          </div>

          <!-- Ações finais -->
          <div style="display:flex;gap:12px;justify-content:flex-end;margin-top:8px">
            <button class="btn btn-secondary" onclick="limparForm()">Limpar formulário</button>
            <button class="btn btn-primary" id="btn-salvar-bottom">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/></svg>
              Salvar Colaborador
            </button>
          </div>

        </div>
      </div>
    </div>
  </main>
</div>

<script src="/js/app.js"></script>
<script>
document.getElementById('sidebar-placeholder').innerHTML = renderSidebar();
initSidebar();

function collectFormData() {
  const data = {};
  document.querySelectorAll('[name]').forEach(el => { data[el.name] = el.value; });
  return data;
}

function limparForm() {
  if (!confirm('Limpar todos os campos?')) return;
  document.querySelectorAll('[name]').forEach(el => { el.value = ''; });
}

async function salvar() {
  const data = collectFormData();
  if (!data.nome?.trim()) { showToast('error', 'Campo obrigatório', 'Informe o Nome Completo.'); return; }
  if (!data.cpf?.trim()) { showToast('error', 'Campo obrigatório', 'Informe o CPF.'); return; }

  const btn = document.getElementById('btn-salvar');
  btn.disabled = true; btn.textContent = 'Salvando…';
  try {
    await API.post('/api/colaboradores', data);
    showToast('success', 'Colaborador cadastrado!', data.nome);
    setTimeout(() => window.location.href = '/colaboradores.html', 1500);
  } catch(e) {
    showToast('error', 'Erro ao cadastrar', e.message);
    btn.disabled = false;
    btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg> Salvar Colaborador`;
  }
}

document.getElementById('btn-salvar').addEventListener('click', salvar);
document.getElementById('btn-salvar-bottom').addEventListener('click', salvar);
</script>
</body>
</html>
